name: Production Installer Release Toolchain Availability Audit

on:
  pull_request:
    paths:
      - "scripts/production-installer-release-toolchain-availability-audit.sh"
      - "scripts/test-production-installer-release-toolchain-availability-audit-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/production-installer-release-toolchain-availability-audit.sh"
      - "scripts/test-production-installer-release-toolchain-availability-audit-contract.sh"

permissions:
  contents: read

jobs:
  production-installer-release-toolchain-availability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer release toolchain availability audit guard
        run: sh scripts/test-production-installer-release-toolchain-availability-audit-contract.sh
