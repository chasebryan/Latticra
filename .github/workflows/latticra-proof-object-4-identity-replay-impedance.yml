name: Latticra Proof Object 4 Identity-Replay Impedance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra proof object 4 identity-replay impedance guard
        run: sh scripts/test-latticra-proof-object-4-identity-replay-impedance.sh
