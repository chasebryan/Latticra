name: Ubuntu Local Deb Static Validation

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-local-deb-static-validation.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-local-deb-static-validation.sh"

permissions:
  contents: read

jobs:
  ubuntu-local-deb-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu local deb static validation guard
        run: sh scripts/test-ubuntu-local-deb-static-validation.sh
