name: Fedora Install Verification Plan

on:
  pull_request:
    paths:
      - "scripts/test-fedora-install-verification-plan.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-install-verification-plan.sh"

permissions:
  contents: read

jobs:
  fedora-install-verification-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora install verification plan guard
        run: sh scripts/test-fedora-install-verification-plan.sh