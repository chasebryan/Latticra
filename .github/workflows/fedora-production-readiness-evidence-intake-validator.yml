name: Fedora Production Readiness Evidence Intake Validator

on:
  push:
    paths:
      - 'docs/FEDORA_PRODUCTION_READINESS_EVIDENCE_INTAKE_VALIDATOR.md'
      - 'docs/status/FEDORA_PRODUCTION_READINESS_EVIDENCE_INTAKE_VALIDATOR_STATUS.md'
      - 'scripts/fedora-production-readiness-evidence-intake.sh'
      - 'scripts/test-fedora-production-readiness-evidence-intake-validator.sh'
      - '.github/workflows/fedora-production-readiness-evidence-intake-validator.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fedora-production-readiness-evidence-intake-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora production readiness evidence intake validator guard
        run: sh scripts/test-fedora-production-readiness-evidence-intake-validator.sh
