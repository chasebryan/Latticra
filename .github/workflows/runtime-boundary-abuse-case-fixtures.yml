name: Runtime Boundary Abuse-Case Fixtures

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: sh scripts/test-runtime-boundary-abuse-case-fixtures.sh
