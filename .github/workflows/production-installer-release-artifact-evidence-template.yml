name: Production Installer Release Artifact Evidence Template

on:
  pull_request:
    paths:
      - "scripts/production-installer-release-artifact-evidence-template.sh"
      - "scripts/test-production-installer-release-artifact-evidence-template-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/production-installer-release-artifact-evidence-template.sh"
      - "scripts/test-production-installer-release-artifact-evidence-template-contract.sh"

permissions:
  contents: read

jobs:
  production-installer-release-artifact-evidence-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer release artifact evidence template guard
        run: sh scripts/test-production-installer-release-artifact-evidence-template-contract.sh
