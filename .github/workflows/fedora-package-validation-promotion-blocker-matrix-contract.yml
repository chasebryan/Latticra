name: Fedora Package Validation Promotion Blocker Matrix Contract

on:
  pull_request:
    paths:
      - "scripts/test-fedora-package-validation-promotion-blocker-matrix-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-package-validation-promotion-blocker-matrix-contract.sh"

permissions:
  contents: read

jobs:
  fedora-package-validation-promotion-blocker-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora package validation promotion blocker matrix contract guard
        run: sh scripts/test-fedora-package-validation-promotion-blocker-matrix-contract.sh
