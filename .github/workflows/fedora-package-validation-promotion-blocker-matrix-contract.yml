name: Fedora Package Validation Promotion Blocker Matrix Contract

on:
  push:
    paths:
      - 'docs/FEDORA_PACKAGE_VALIDATION_PROMOTION_BLOCKER_MATRIX_CONTRACT.md'
      - 'docs/status/FEDORA_PACKAGE_VALIDATION_PROMOTION_BLOCKER_MATRIX_CONTRACT_STATUS.md'
      - 'scripts/test-fedora-package-validation-promotion-blocker-matrix-contract.sh'
      - '.github/workflows/fedora-package-validation-promotion-blocker-matrix-contract.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fedora-package-validation-promotion-blocker-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora package validation promotion blocker matrix contract guard
        run: sh scripts/test-fedora-package-validation-promotion-blocker-matrix-contract.sh
