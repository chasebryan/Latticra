name: Fedora Local RPM Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-local-rpm-build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Prepare checkout tools
        run: dnf -y install git tar gzip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Fedora local binary RPM build guard
        run: sh scripts/test-fedora-local-binary-rpm-build-lane.sh