name: System Bootstrap Report Runner

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  system-bootstrap-report-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run system bootstrap report runner guard
        run: sh scripts/test-system-bootstrap-report-runner.sh
