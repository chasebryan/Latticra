name: Ubuntu Package License Review Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu-package-license-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu package license review contract guard
        run: sh scripts/test-ubuntu-package-license-review-contract.sh
