name: Fedora rpmlint Static Spec Lane

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-rpmlint-static-spec-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Prepare checkout tools
        run: dnf -y install git tar gzip
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora rpmlint static spec lane guard
        run: sh scripts/test-fedora-rpmlint-static-spec-lane.sh