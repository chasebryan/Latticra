name: Kernel Lifecycle Subsystem Summary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-lifecycle-subsystem-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel lifecycle subsystem summary guard
        run: sh scripts/test-kernel-lifecycle-subsystem-summary.sh
      - name: Run kernel lifecycle subsystem summary report runner guard
        run: sh scripts/test-kernel-lifecycle-subsystem-summary-report-runner.sh
