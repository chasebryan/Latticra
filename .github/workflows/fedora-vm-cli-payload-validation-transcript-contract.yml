      - main

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-validation-transcript-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM CLI payload validation transcript contract guard
        run: sh scripts/test-fedora-disposable-vm-cli-payload-validation-transcript-contract.sh
