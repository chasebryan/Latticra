name: Latticra Proof Object 2 Higgs Counterplay

on:
  pull_request:
    paths:
      - "scripts/test-latticra-proof-object-2-higgs-counterplay.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-proof-object-2-higgs-counterplay.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra proof object 2 Higgs counterplay guard
        run: sh scripts/test-latticra-proof-object-2-higgs-counterplay.sh
