name: Lat-to-LIR Lowering

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-to-lir-lowering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Lat-to-LIR lowering tests
        run: sh scripts/test-lat-to-lir-lowering.sh
