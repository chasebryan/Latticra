      - main

permissions:
  contents: read

jobs:
  nadia-prompt-evaluation-result-disposition-contract-stage-33:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Nadia prompt evaluation result disposition contract Stage 33
        run: sh scripts/test-nadia-prompt-evaluation-result-disposition-contract-stage-33.sh
