name: Nucleus Task No-Effect Report Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nucleus-task-no-effect-report-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Nucleus no-effect report alignment guard
        run: sh scripts/test-nucleus-task-no-effect-report-alignment.sh
      - name: Run Nucleus task execution tests
        run: sh scripts/test-nucleus-task-execution.sh
