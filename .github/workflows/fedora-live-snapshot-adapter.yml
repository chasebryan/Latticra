name: Fedora Live Snapshot Adapter

on:
  pull_request:
    paths:
      - "scripts/test-fedora-live-snapshot-adapter-docs.sh"
      - "scripts/test-fedora-live-snapshot-adapter.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-live-snapshot-adapter-docs.sh"
      - "scripts/test-fedora-live-snapshot-adapter.sh"

permissions:
  contents: read

jobs:
  fedora-live-snapshot-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora live snapshot adapter guard
        run: sh scripts/test-fedora-live-snapshot-adapter.sh
      - name: Run Fedora live snapshot adapter docs guard
        run: sh scripts/test-fedora-live-snapshot-adapter-docs.sh
