name: Fedora RPM Install Remove Transcript Contract

on:
  push:
    paths:
      - 'docs/FEDORA_RPM_INSTALL_REMOVE_TRANSCRIPT_CONTRACT.md'
      - 'docs/status/FEDORA_RPM_INSTALL_REMOVE_TRANSCRIPT_CONTRACT_STATUS.md'
      - 'scripts/test-fedora-rpm-install-remove-transcript-contract.sh'
      - '.github/workflows/fedora-rpm-install-remove-transcript-contract.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fedora-rpm-install-remove-transcript-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM install/remove transcript contract guard
        run: sh scripts/test-fedora-rpm-install-remove-transcript-contract.sh
