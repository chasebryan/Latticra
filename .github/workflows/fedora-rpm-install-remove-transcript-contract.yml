name: Fedora RPM Install Remove Transcript Contract

on:
  pull_request:
    paths:
      - "scripts/test-fedora-rpm-install-remove-transcript-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-rpm-install-remove-transcript-contract.sh"

permissions:
  contents: read

jobs:
  fedora-rpm-install-remove-transcript-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM install/remove transcript contract guard
        run: sh scripts/test-fedora-rpm-install-remove-transcript-contract.sh
