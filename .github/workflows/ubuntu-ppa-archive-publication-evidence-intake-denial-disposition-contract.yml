name: Ubuntu PPA Archive Publication Evidence Intake Denial Disposition Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-ppa-archive-publication-evidence-intake-denial-disposition-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-ppa-archive-publication-evidence-intake-denial-disposition-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-ppa-archive-publication-evidence-intake-denial-disposition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu PPA archive publication evidence intake denial disposition guard
        run: sh scripts/test-ubuntu-ppa-archive-publication-evidence-intake-denial-disposition-contract.sh
