name: Defensive Threat Model

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  defensive-threat-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run contract guard
        run: sh scripts/test-defensive-threat-model-contract.sh
      - name: Run implementation plan guard
        run: sh scripts/test-defensive-threat-model-implementation-plan.sh
      - name: Run validation ledger guard
        run: sh scripts/test-defensive-threat-model-validation.sh
