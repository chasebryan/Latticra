name: Fedora Live Snapshot Adapter Status Alignment

on:
  pull_request:
    paths:
      - "scripts/test-fedora-live-snapshot-adapter-status-alignment.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-live-snapshot-adapter-status-alignment.sh"

permissions:
  contents: read

jobs:
  fedora-live-snapshot-adapter-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora live snapshot adapter status alignment guard
        run: sh scripts/test-fedora-live-snapshot-adapter-status-alignment.sh
