name: Fedora Installroot RPM Mutation Lane Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-installroot-rpm-mutation-lane-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora installroot RPM mutation lane docs guard
        run: sh scripts/test-fedora-installroot-rpm-mutation-lane-docs.sh
