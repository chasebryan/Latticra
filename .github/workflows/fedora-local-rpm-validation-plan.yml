name: Fedora Local RPM Validation Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-local-rpm-validation-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Fedora local RPM validation plan guard
        run: sh scripts/test-fedora-local-rpm-validation-plan.sh
