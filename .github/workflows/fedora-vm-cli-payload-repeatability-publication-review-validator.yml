name: Fedora VM CLI Payload Repeatability Publication Review Validator

on:
  pull_request:
    paths:
      - "scripts/fedora-vm-cli-payload-repeatability-publication-review.sh"
      - "scripts/test-fedora-vm-cli-payload-repeatability-publication-review-validator.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/fedora-vm-cli-payload-repeatability-publication-review.sh"
      - "scripts/test-fedora-vm-cli-payload-repeatability-publication-review-validator.sh"

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-repeatability-publication-review-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora VM CLI payload repeatability publication review validator guard
        run: sh scripts/test-fedora-vm-cli-payload-repeatability-publication-review-validator.sh
