name: Ubuntu Debian Copyright Notice Mapping Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-debian-copyright-notice-mapping-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-debian-copyright-notice-mapping-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-debian-copyright-notice-mapping-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu Debian copyright notice mapping contract guard
        run: sh scripts/test-ubuntu-debian-copyright-notice-mapping-contract.sh
