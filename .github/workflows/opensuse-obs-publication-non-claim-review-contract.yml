name: openSUSE OBS Publication Non Claim Review Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opensuse-obs-publication-non-claim-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE OBS publication non-claim review contract guard
        run: sh scripts/test-opensuse-obs-publication-non-claim-review-contract.sh
