name: Fedora VM RPM Validation Announcement

on:
  pull_request:
    paths:
      - "scripts/test-fedora-vm-rpm-validation-announcement.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-vm-rpm-validation-announcement.sh"

permissions:
  contents: read

jobs:
  fedora-vm-rpm-validation-announcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check Fedora VM RPM validation announcement
        run: sh scripts/test-fedora-vm-rpm-validation-announcement.sh
