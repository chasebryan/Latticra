name: Fedora VM RPM Validation Announcement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-rpm-validation-announcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check Fedora VM RPM validation announcement
        run: sh scripts/test-fedora-vm-rpm-validation-announcement.sh
