name: Fedora Host Install Preflight Status Alignment

on:
  pull_request:
    paths:
      - "scripts/test-fedora-host-install-preflight-status-alignment.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-host-install-preflight-status-alignment.sh"

permissions:
  contents: read

jobs:
  fedora-host-install-preflight-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora host install preflight status alignment guard
        run: sh scripts/test-fedora-host-install-preflight-status-alignment.sh
