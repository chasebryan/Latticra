name: Fedora Host Install Preflight Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-host-install-preflight-status-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora host install preflight status alignment guard
        run: sh scripts/test-fedora-host-install-preflight-status-alignment.sh
