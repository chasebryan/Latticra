name: Lat-Specific LIR Refinement

on:
  pull_request:
    paths:
      - "scripts/test-lat-specific-lir-refinement.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-lat-specific-lir-refinement.sh"

permissions:
  contents: read

jobs:
  lat-specific-lir-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Lat-specific LIR refinement tests
        run: sh scripts/test-lat-specific-lir-refinement.sh
