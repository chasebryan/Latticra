name: Lat-Specific LIR Refinement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-specific-lir-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Lat-specific LIR refinement tests
        run: sh scripts/test-lat-specific-lir-refinement.sh
