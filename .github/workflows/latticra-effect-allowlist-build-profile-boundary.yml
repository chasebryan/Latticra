name: Latticra Effect Allowlist Build Profile Boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra effect allowlist/build-profile boundary guard
        run: sh scripts/test-latticra-effect-allowlist-build-profile-boundary.sh
