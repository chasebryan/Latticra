name: macOS Codesigning and Notarization Plan

on:
  pull_request:
    paths:
      - "scripts/test-macos-codesigning-notarization-plan.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-macos-codesigning-notarization-plan.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run macOS codesigning and notarization plan guard
        run: sh scripts/test-macos-codesigning-notarization-plan.sh
