name: Kernel IPC Table

on:
  pull_request:
    paths:
      - "scripts/test-kernel-ipc-table-report-runner.sh"
      - "scripts/test-kernel-ipc-table.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-ipc-table-report-runner.sh"
      - "scripts/test-kernel-ipc-table.sh"

permissions:
  contents: read

jobs:
  kernel-ipc-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel IPC table guard
        run: sh scripts/test-kernel-ipc-table.sh
      - name: Run kernel IPC table report runner guard
        run: sh scripts/test-kernel-ipc-table-report-runner.sh
