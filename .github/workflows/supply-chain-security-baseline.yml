name: Supply Chain Security Baseline

on:
  pull_request:
    paths:
      - "scripts/test-fedora-source-archive-fixture-lane.sh"
      - "scripts/test-quality-safety-guards.sh"
      - "scripts/test-supply-chain-security-baseline.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-source-archive-fixture-lane.sh"
      - "scripts/test-quality-safety-guards.sh"
      - "scripts/test-supply-chain-security-baseline.sh"

permissions:
  contents: read

jobs:
  supply-chain-security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate supply chain security baseline
        run: sh scripts/test-supply-chain-security-baseline.sh
