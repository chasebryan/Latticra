name: openSUSE Source Archive Fixture Lane

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  opensuse-source-archive-fixture-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE source archive fixture lane guard
        run: sh scripts/test-opensuse-source-archive-fixture-lane.sh
