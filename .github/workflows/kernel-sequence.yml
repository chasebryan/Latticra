name: Kernel Sequence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run kernel sequence guard
        run: sh scripts/test-kernel-lifecycle.sh
      - name: Run kernel lifecycle report runner guard
        run: sh scripts/test-kernel-lifecycle-report-runner.sh
