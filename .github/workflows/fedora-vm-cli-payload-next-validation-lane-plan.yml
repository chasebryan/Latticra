name: Fedora VM CLI Payload Next Validation Lane Plan

on:
  pull_request:
    paths:
      - "scripts/test-fedora-vm-cli-payload-next-validation-lane-plan.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-vm-cli-payload-next-validation-lane-plan.sh"

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-next-validation-lane-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora VM CLI payload next validation lane plan guard
        run: sh scripts/test-fedora-vm-cli-payload-next-validation-lane-plan.sh
