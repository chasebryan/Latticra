name: Fedora RPM Gate Classifier

on:
  pull_request:
    paths:
      - "scripts/test-fedora-rpm-gate-classifier-docs.sh"
      - "scripts/test-fedora-rpm-gate-classifier.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-rpm-gate-classifier-docs.sh"
      - "scripts/test-fedora-rpm-gate-classifier.sh"

permissions:
  contents: read

jobs:
  fedora-rpm-gate-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM gate classifier guard
        run: sh scripts/test-fedora-rpm-gate-classifier.sh
      - name: Run Fedora RPM gate classifier docs guard
        run: sh scripts/test-fedora-rpm-gate-classifier-docs.sh
