name: Kernel run queue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-run-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel run queue guard
        run: sh scripts/test-kernel-run-queue.sh

      - name: Run kernel run queue report runner
        run: sh scripts/test-kernel-run-queue-report-runner.sh
