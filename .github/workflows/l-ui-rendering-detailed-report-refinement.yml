name: L-UI Rendering Detailed Report Refinement

on:
  pull_request:
    paths:
      - "scripts/test-l-ui-rendering-detailed-report-refinement.sh"
      - "scripts/test-l-ui-rendering.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-l-ui-rendering-detailed-report-refinement.sh"
      - "scripts/test-l-ui-rendering.sh"

permissions:
  contents: read

jobs:
  l-ui-rendering-detailed-report-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run L-UI rendering detailed report refinement guard
        run: sh scripts/test-l-ui-rendering-detailed-report-refinement.sh
      - name: Run L-UI rendering tests
        run: sh scripts/test-l-ui-rendering.sh
