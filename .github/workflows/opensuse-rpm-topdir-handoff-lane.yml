name: openSUSE RPM Topdir Handoff Lane

on:
  pull_request:
    paths:
      - "scripts/test-opensuse-rpm-topdir-handoff-lane.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-opensuse-rpm-topdir-handoff-lane.sh"

permissions:
  contents: read

jobs:
  opensuse-rpm-topdir-handoff-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE RPM topdir handoff lane guard
        run: sh scripts/test-opensuse-rpm-topdir-handoff-lane.sh
