name: Production Installer Readiness Contract

on:
  pull_request:
    paths:
      - "scripts/test-production-installer-readiness-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-production-installer-readiness-contract.sh"

permissions:
  contents: read

jobs:
  production-installer-readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer readiness contract guard
        run: sh scripts/test-production-installer-readiness-contract.sh
