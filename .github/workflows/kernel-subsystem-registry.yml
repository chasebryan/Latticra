name: Kernel Subsystem Registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-subsystem-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run kernel subsystem registry guard
        run: sh scripts/test-kernel-subsystem-registry.sh
      - name: Run kernel subsystem registry report runner guard
        run: sh scripts/test-kernel-subsystem-registry-report-runner.sh
