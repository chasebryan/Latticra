name: Ubuntu PPA Evidence Closeout Gate Review Disposition

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-ppa-evidence-closeout-gate-review-disposition.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-ppa-evidence-closeout-gate-review-disposition.sh"

permissions:
  contents: read

jobs:
  closeout-gate-review-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu PPA evidence intake denial closeout gate review disposition guard
        run: sh scripts/test-ubuntu-ppa-evidence-closeout-gate-review-disposition.sh
