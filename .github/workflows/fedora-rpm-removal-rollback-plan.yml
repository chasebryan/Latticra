name: Fedora RPM Removal Rollback Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-rpm-removal-rollback-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM removal rollback plan guard
        run: sh scripts/test-fedora-local-rpm-removal-rollback-plan.sh
