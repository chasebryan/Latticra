name: Ubuntu NOTICE File Decision Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-notice-file-decision-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-notice-file-decision-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-notice-file-decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu NOTICE file decision contract guard
        run: sh scripts/test-ubuntu-notice-file-decision-contract.sh
