name: Kernel interrupt table

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-interrupt-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel interrupt table guard
        run: sh scripts/test-kernel-interrupt-table.sh

      - name: Run kernel interrupt table report runner
        run: sh scripts/test-kernel-interrupt-table-report-runner.sh
