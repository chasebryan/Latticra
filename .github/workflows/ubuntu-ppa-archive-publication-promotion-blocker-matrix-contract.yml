name: Ubuntu PPA Archive Publication Promotion Blocker Matrix Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu-ppa-archive-publication-promotion-blocker-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu PPA archive publication promotion blocker matrix guard
        run: sh scripts/test-ubuntu-ppa-archive-publication-promotion-blocker-matrix-contract.sh
