name: Kernel Map Metadata

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-map-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel map metadata guard
        run: sh scripts/test-kernel-memory-map.sh
      - name: Run kernel map metadata report guard
        run: sh scripts/test-kernel-memory-map-report-runner.sh
