name: Kernel Metadata Slots

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-metadata-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run kernel metadata slot guard
        run: sh scripts/test-kernel-scheduler.sh
      - name: Run kernel metadata slot report guard
        run: sh scripts/test-kernel-scheduler-report-runner.sh
