name: Lat Pipeline Report Refinement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-pipeline-report-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Lat pipeline report refinement guard
        run: sh scripts/test-lat-pipeline-report-refinement.sh
      - name: Run Lat pipeline tests
        run: sh scripts/test-lat-pipeline.sh
