name: Kernel Runtime Entry Recovery Archive Gate Review Disposition Observation View

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel-runtime-entry-recovery-archive-gate-review-disposition-observation-view:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel runtime-entry recovery-audit-review-disposition-review-closeout-archive-gate-review-disposition-observation-view guard
        run: sh scripts/test-kernel-runtime-entry-recovery-audit-review-disposition-review-closeout-archive-gate-review-disposition-observation-view.sh

      - name: Run kernel runtime-entry recovery-audit-review-disposition-review-closeout-archive-gate-review-disposition-observation-view report runner
        run: sh scripts/test-kernel-runtime-entry-recovery-audit-review-disposition-review-closeout-archive-gate-review-disposition-observation-view-report-runner.sh
