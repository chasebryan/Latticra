name: openSUSE rpmlint and osc Availability

on:
  pull_request:
    paths:
      - "scripts/test-opensuse-rpmlint-osc-availability.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-opensuse-rpmlint-osc-availability.sh"

permissions:
  contents: read

jobs:
  opensuse-rpmlint-osc-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - name: Prepare checkout tools
        run: zypper --non-interactive install git tar gzip
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE rpmlint and osc availability guard
        run: sh scripts/test-opensuse-rpmlint-osc-availability.sh
