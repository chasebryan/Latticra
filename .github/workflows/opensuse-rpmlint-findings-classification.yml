name: openSUSE rpmlint Findings Classification

on:
  pull_request:
    paths:
      - "scripts/test-opensuse-rpmlint-findings-classification.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-opensuse-rpmlint-findings-classification.sh"

permissions:
  contents: read

jobs:
  opensuse-rpmlint-findings-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE rpmlint findings classification guard
        run: sh scripts/test-opensuse-rpmlint-findings-classification.sh
