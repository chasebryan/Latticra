name: Fedora Host Install Decision Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-host-install-decision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora host install decision gate guard
        run: sh scripts/test-fedora-host-install-decision-gate.sh