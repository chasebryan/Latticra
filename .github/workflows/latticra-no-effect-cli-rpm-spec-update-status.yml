name: Latticra No-Effect CLI RPM Spec Update Status

on:
  pull_request:
    paths:
      - "scripts/test-latticra-no-effect-cli-rpm-spec-update-status.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-no-effect-cli-rpm-spec-update-status.sh"

permissions:
  contents: read

jobs:
  latticra-no-effect-cli-rpm-spec-update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra no-effect CLI RPM spec update status guard
        run: sh scripts/test-latticra-no-effect-cli-rpm-spec-update-status.sh
