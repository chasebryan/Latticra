name: Kernel runtime entry register view

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-runtime-entry-register-view:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel runtime-entry register-view guard
        run: sh scripts/test-kernel-runtime-entry-register-view.sh

      - name: Run kernel runtime-entry register-view report runner
        run: sh scripts/test-kernel-runtime-entry-register-view-report-runner.sh
