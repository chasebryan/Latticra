name: Latticra Proof Object 1 Emergent Particle Mass

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra proof object 1 emergent particle mass guard
        run: sh scripts/test-latticra-proof-object-1-emergent-particle-mass.sh
