name: Fedora Source Archive Accepted Evidence Status Review Validator

on:
  pull_request:
    paths:
      - "scripts/fedora-source-archive-accepted-evidence-status-review.sh"
      - "scripts/test-fedora-source-archive-accepted-evidence-status-review-validator.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/fedora-source-archive-accepted-evidence-status-review.sh"
      - "scripts/test-fedora-source-archive-accepted-evidence-status-review-validator.sh"

permissions:
  contents: read

jobs:
  fedora-source-archive-accepted-evidence-status-review-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora source archive accepted evidence status review validator guard
        run: sh scripts/test-fedora-source-archive-accepted-evidence-status-review-validator.sh
