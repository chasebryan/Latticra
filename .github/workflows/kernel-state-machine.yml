name: Kernel State Machine

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel state machine guard
        run: sh scripts/test-kernel-state-machine.sh
      - name: Run kernel state machine report guard
        run: sh scripts/test-kernel-state-machine-report-runner.sh
