name: Nadia Prompt Evaluation Result Review Contract Stage 32

on:
  pull_request:
    paths:
      - "scripts/test-nadia-prompt-evaluation-result-review-contract-stage-32.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-nadia-prompt-evaluation-result-review-contract-stage-32.sh"

permissions:
  contents: read

jobs:
  nadia-prompt-evaluation-result-review-contract-stage-32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Nadia prompt evaluation result review contract Stage 32
        run: sh scripts/test-nadia-prompt-evaluation-result-review-contract-stage-32.sh
