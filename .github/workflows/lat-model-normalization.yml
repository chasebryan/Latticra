name: Lat Model Normalization

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-model-normalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Lat model normalization tests
        run: sh scripts/test-lat-model-normalization.sh
