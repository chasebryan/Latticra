name: Fedora VM RPM Validation Transcript Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-rpm-validation-transcript-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora VM RPM validation transcript contract guard
        run: sh scripts/test-fedora-disposable-vm-local-rpm-validation-transcript-contract.sh
