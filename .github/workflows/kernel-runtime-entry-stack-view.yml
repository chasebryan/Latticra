name: Kernel runtime entry stack view

on:
  pull_request:
    paths:
      - "scripts/test-kernel-runtime-entry-stack-view-report-runner.sh"
      - "scripts/test-kernel-runtime-entry-stack-view.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-runtime-entry-stack-view-report-runner.sh"
      - "scripts/test-kernel-runtime-entry-stack-view.sh"

permissions:
  contents: read

jobs:
  kernel-runtime-entry-stack-view:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel runtime-entry stack-view guard
        run: sh scripts/test-kernel-runtime-entry-stack-view.sh

      - name: Run kernel runtime-entry stack-view report runner
        run: sh scripts/test-kernel-runtime-entry-stack-view-report-runner.sh
