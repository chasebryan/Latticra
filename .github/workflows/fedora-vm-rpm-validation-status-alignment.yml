name: Fedora VM RPM Validation Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-rpm-validation-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora VM RPM validation status alignment guard
        run: sh scripts/test-fedora-disposable-vm-local-rpm-validation-status-alignment.sh
