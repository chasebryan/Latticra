name: Kernel Scheduler

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel scheduler guard
        run: sh scripts/test-kernel-scheduler.sh
      - name: Run kernel scheduler report runner guard
        run: sh scripts/test-kernel-scheduler-report-runner.sh
