name: Runtime Boundary Report Refinement

on:
  pull_request:
    paths:
      - "scripts/test-runtime-boundary-report-refinement.sh"
      - "scripts/test-runtime-boundary.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-runtime-boundary-report-refinement.sh"
      - "scripts/test-runtime-boundary.sh"

permissions:
  contents: read

jobs:
  runtime-boundary-report-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run runtime boundary report refinement guard
        run: sh scripts/test-runtime-boundary-report-refinement.sh
      - name: Run runtime boundary tests
        run: sh scripts/test-runtime-boundary.sh
