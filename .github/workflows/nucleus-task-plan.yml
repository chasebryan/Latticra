name: Nucleus Task Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nucleus-task-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Nucleus task plan tests
        run: sh scripts/test-nucleus-task-plan.sh
