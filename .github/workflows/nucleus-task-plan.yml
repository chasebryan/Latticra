name: Nucleus Task Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nucleus-task-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Nucleus task plan tests
        run: sh scripts/test-nucleus-task-plan.sh
