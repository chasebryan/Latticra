name: Runtime Boundary Abuse-Case Completion Estimate Review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-completion-estimate-review-after-runtime-boundary-abuse-case-fixtures.sh
