name: Latticra Seal Policy

on:
  pull_request:
    paths:
      - "Makefile"
      - "latticra.seal"
      - "scripts/latticra-seal-smoke.sh"
      - "scripts/test-latticra-seal-policy-denials.sh"
      - ".github/workflows/latticra-seal-policy.yml"
  push:
    branches:
      - main
    paths:
      - "Makefile"
      - "latticra.seal"
      - "scripts/latticra-seal-smoke.sh"
      - "scripts/test-latticra-seal-policy-denials.sh"
      - ".github/workflows/latticra-seal-policy.yml"

permissions:
  contents: read

jobs:
  seal-policy:
    name: Seal policy regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run Seal smoke check
        run: make seal

      - name: Run Seal policy regression
        run: make seal-policy-denials
