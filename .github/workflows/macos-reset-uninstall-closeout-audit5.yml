name: macos-reset-uninstall-closeout-audit5

on:
  pull_request:
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-closeout-audit5.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-closeout-audit5.sh"

permissions:
  contents: read

jobs:
  closeout-audit5-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate no-effect macOS reset/uninstall closeout audit5 contract
        run: sh scripts/test-macos-reset-uninstall-live-runner-closeout-audit5.sh
