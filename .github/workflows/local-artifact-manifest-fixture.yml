name: Local Artifact Manifest Fixture

on:
  pull_request:
    paths:
      - "scripts/test-local-artifact-manifest-fixture.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-local-artifact-manifest-fixture.sh"

permissions:
  contents: read

jobs:
  local-artifact-manifest-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run local artifact manifest fixture guard
        run: sh scripts/test-local-artifact-manifest-fixture.sh
