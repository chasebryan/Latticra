name: Latticra Identity-Replay Model-3 Topological Amplification Pre-Registration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra identity-replay Model-3 topological amplification pre-registration guard
        run: sh scripts/test-latticra-identity-replay-model3-topological-amplification-preregistration.sh
