name: Latticra Identity-Replay Impedance L3 Holdout Intake

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra identity-replay impedance L3 external blinded-holdout intake guard
        run: sh scripts/test-latticra-identity-replay-impedance-l3-external-blinded-holdout-intake.sh
