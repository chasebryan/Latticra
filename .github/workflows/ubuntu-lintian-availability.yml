name: Ubuntu lintian Availability

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-lintian-availability.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-lintian-availability.sh"

permissions:
  contents: read

jobs:
  ubuntu-lintian-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu lintian availability guard
        run: sh scripts/test-ubuntu-lintian-availability.sh
