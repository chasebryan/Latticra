name: Fedora Local RPM Gate Contract

on:
  pull_request:
    paths:
      - "scripts/test-fedora-local-rpm-install-mutation-gate-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-local-rpm-install-mutation-gate-contract.sh"

permissions:
  contents: read

jobs:
  fedora-local-rpm-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora local RPM gate contract guard
        run: sh scripts/test-fedora-local-rpm-install-mutation-gate-contract.sh
