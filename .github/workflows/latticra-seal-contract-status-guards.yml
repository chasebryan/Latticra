name: Latticra Seal Contract Status Guards

on:
  pull_request:
    paths:
      - "scripts/test-latticra-seal-capability-metadata-implementation-plan.sh"
      - "scripts/test-latticra-seal-core-blocked-cases-status.sh"
      - "scripts/test-latticra-seal-replayed-request-case-contract.sh"
      - "scripts/test-latticra-seal-signature-implementation-contract.sh"
      - "scripts/test-latticra-seal-signed-manifest-contract.sh"
      - "scripts/test-latticra-seal-unsigned-request-case-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-seal-capability-metadata-implementation-plan.sh"
      - "scripts/test-latticra-seal-core-blocked-cases-status.sh"
      - "scripts/test-latticra-seal-replayed-request-case-contract.sh"
      - "scripts/test-latticra-seal-signature-implementation-contract.sh"
      - "scripts/test-latticra-seal-signed-manifest-contract.sh"
      - "scripts/test-latticra-seal-unsigned-request-case-contract.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: sh scripts/test-latticra-seal-capability-metadata-implementation-plan.sh
      - run: sh scripts/test-latticra-seal-core-blocked-cases-status.sh
      - run: sh scripts/test-latticra-seal-replayed-request-case-contract.sh
      - run: sh scripts/test-latticra-seal-signature-implementation-contract.sh
      - run: sh scripts/test-latticra-seal-signed-manifest-contract.sh
      - run: sh scripts/test-latticra-seal-unsigned-request-case-contract.sh
