name: Latticra Lat Seal Roadmap

on:
  pull_request:
  push:
    branches:
      - main
      - 'roadmap/**'

permissions:
  contents: read

jobs:
  roadmap-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate Latticra Lat Seal roadmap
        run: sh scripts/test-latticra-lat-seal-roadmap.sh
