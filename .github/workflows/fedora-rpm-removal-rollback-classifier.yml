name: Fedora RPM Removal Rollback Classifier

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-rpm-removal-rollback-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora RPM removal rollback classifier guard
        run: sh scripts/test-fedora-rpm-removal-rollback-classifier.sh
      - name: Run Fedora RPM removal rollback classifier docs guard
        run: sh scripts/test-fedora-rpm-removal-rollback-classifier-docs.sh
