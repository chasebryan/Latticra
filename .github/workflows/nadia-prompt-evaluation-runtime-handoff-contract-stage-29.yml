name: Nadia Prompt Evaluation Runtime Handoff Contract Stage 29

on:
  pull_request:
    paths:
      - "scripts/test-nadia-prompt-evaluation-runtime-handoff-contract-stage-29.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-nadia-prompt-evaluation-runtime-handoff-contract-stage-29.sh"

permissions:
  contents: read

jobs:
  nadia-prompt-evaluation-runtime-handoff-contract-stage-29:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Nadia prompt evaluation runtime handoff contract Stage 29
        run: sh scripts/test-nadia-prompt-evaluation-runtime-handoff-contract-stage-29.sh
