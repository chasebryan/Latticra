name: Ubuntu Launchpad Build Result Evidence Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-launchpad-build-result-evidence-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-launchpad-build-result-evidence-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-launchpad-build-result-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu Launchpad build result evidence guard
        run: sh scripts/test-ubuntu-launchpad-build-result-evidence-contract.sh
