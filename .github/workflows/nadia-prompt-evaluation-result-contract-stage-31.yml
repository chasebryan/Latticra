name: Nadia Prompt Evaluation Result Contract Stage 31

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nadia-prompt-evaluation-result-contract-stage-31:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Nadia prompt evaluation result contract Stage 31
        run: sh scripts/test-nadia-prompt-evaluation-result-contract-stage-31.sh
