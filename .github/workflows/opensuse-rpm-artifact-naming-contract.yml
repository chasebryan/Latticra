name: openSUSE RPM Artifact Naming Contract

on:
  pull_request:
    paths:
      - "scripts/test-opensuse-rpm-artifact-naming-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-opensuse-rpm-artifact-naming-contract.sh"

permissions:
  contents: read

jobs:
  opensuse-rpm-artifact-naming-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE RPM artifact naming contract guard
        run: sh scripts/test-opensuse-rpm-artifact-naming-contract.sh
