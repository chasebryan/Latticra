name: Kernel time accounting

on:
  pull_request:
    paths:
      - "scripts/test-kernel-time-accounting-report-runner.sh"
      - "scripts/test-kernel-time-accounting.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-time-accounting-report-runner.sh"
      - "scripts/test-kernel-time-accounting.sh"

permissions:
  contents: read

jobs:
  kernel-time-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel time accounting guard
        run: sh scripts/test-kernel-time-accounting.sh

      - name: Run kernel time accounting report runner
        run: sh scripts/test-kernel-time-accounting-report-runner.sh
