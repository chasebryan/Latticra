name: Runtime Boundary Policy Matrix Refinement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-boundary-policy-matrix-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run runtime boundary policy matrix refinement guard
        run: sh scripts/test-runtime-boundary-policy-matrix-refinement.sh
      - name: Run runtime boundary tests
        run: sh scripts/test-runtime-boundary.sh
