name: Fedora Local RPM Static Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-local-rpm-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora local RPM static validation guard
        run: sh scripts/test-fedora-local-rpm-static-validation.sh
