name: Fedora Production Readiness Evidence Matrix

on:
  push:
    paths:
      - 'docs/FEDORA_PRODUCTION_READINESS_EVIDENCE_MATRIX.md'
      - 'docs/status/FEDORA_PRODUCTION_READINESS_EVIDENCE_MATRIX_STATUS.md'
      - 'scripts/fedora-production-readiness-evidence-matrix.sh'
      - 'scripts/test-fedora-production-readiness-evidence-matrix.sh'
      - '.github/workflows/fedora-production-readiness-evidence-matrix.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fedora-production-readiness-evidence-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora production readiness evidence matrix guard
        run: sh scripts/test-fedora-production-readiness-evidence-matrix.sh
