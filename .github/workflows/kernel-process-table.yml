name: Kernel Process Table

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-process-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel process table guard
        run: sh scripts/test-kernel-process-table.sh
      - name: Run kernel process table report runner guard
        run: sh scripts/test-kernel-process-table-report-runner.sh
