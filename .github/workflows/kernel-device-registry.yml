name: Kernel device registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-device-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel device registry guard
        run: sh scripts/test-kernel-device-registry.sh

      - name: Run kernel device registry report runner
        run: sh scripts/test-kernel-device-registry-report-runner.sh
