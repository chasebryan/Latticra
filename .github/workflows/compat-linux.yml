name: Compatibility Linux

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compat-linux:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Prepare checkout tools
        run: dnf -y install git tar gzip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run compatibility guard
        run: sh scripts/test-fedora-build-lane.sh
