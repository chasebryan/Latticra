name: Nadia Prompt Evaluation Result Release Contract Stage 34

on:
  pull_request:
    paths:
      - "scripts/test-nadia-prompt-evaluation-result-release-contract-stage-34.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-nadia-prompt-evaluation-result-release-contract-stage-34.sh"

permissions:
  contents: read

jobs:
  nadia-prompt-evaluation-result-release-contract-stage-34:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate Nadia Stage 34 prompt-evaluation result release contract
        run: sh scripts/test-nadia-prompt-evaluation-result-release-contract-stage-34.sh
