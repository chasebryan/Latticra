name: Kernel State

on:
  pull_request:
    paths:
      - "scripts/test-kernel-state-report-runner.sh"
      - "scripts/test-kernel-state.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-state-report-runner.sh"
      - "scripts/test-kernel-state.sh"

permissions:
  contents: read

jobs:
  kernel-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run kernel state guard
        run: sh scripts/test-kernel-state.sh
      - name: Run kernel state report guard
        run: sh scripts/test-kernel-state-report-runner.sh
