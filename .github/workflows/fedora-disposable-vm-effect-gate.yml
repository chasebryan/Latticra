name: Fedora Disposable VM Effect Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-disposable-vm-effect-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora disposable VM effect gate guard
        run: sh scripts/test-fedora-disposable-vm-effect-gate.sh
