name: Fedora Disposable VM Effect Gate

on:
  pull_request:
    paths:
      - "scripts/test-fedora-disposable-vm-effect-gate.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-disposable-vm-effect-gate.sh"

permissions:
  contents: read

jobs:
  fedora-disposable-vm-effect-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora disposable VM effect gate guard
        run: sh scripts/test-fedora-disposable-vm-effect-gate.sh
