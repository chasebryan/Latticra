name: Debian FreeBSD OpenBSD Package Build Evidence Intake Denial Disposition Closeout Contract

on:
  pull_request:
    paths:
      - "scripts/test-debian-freebsd-openbsd-package-build-evidence-intake-denial-disposition-closeout-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-debian-freebsd-openbsd-package-build-evidence-intake-denial-disposition-closeout-contract.sh"

permissions:
  contents: read

jobs:
  debian-freebsd-openbsd-package-build-evidence-intake-denial-disposition-closeout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Debian FreeBSD OpenBSD package build evidence intake denial disposition closeout contract guard
        run: sh scripts/test-debian-freebsd-openbsd-package-build-evidence-intake-denial-disposition-closeout-contract.sh
