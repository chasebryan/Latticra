name: Latticra Proof Object 3 Higgs Causal Closure No-Go

on:
  pull_request:
    paths:
      - "scripts/test-latticra-proof-object-3-higgs-causal-closure-no-go.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-proof-object-3-higgs-causal-closure-no-go.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra proof object 3 Higgs causal closure no-go guard
        run: sh scripts/test-latticra-proof-object-3-higgs-causal-closure-no-go.sh
