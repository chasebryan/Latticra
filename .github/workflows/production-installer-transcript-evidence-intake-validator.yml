name: Production Installer Transcript Evidence Intake Validator

on:
  pull_request:
    paths:
      - "scripts/production-installer-transcript-evidence-intake.sh"
      - "scripts/test-production-installer-transcript-evidence-intake-validator-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/production-installer-transcript-evidence-intake.sh"
      - "scripts/test-production-installer-transcript-evidence-intake-validator-contract.sh"

permissions:
  contents: read

jobs:
  production-installer-transcript-evidence-intake-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer transcript evidence intake validator guard
        run: sh scripts/test-production-installer-transcript-evidence-intake-validator-contract.sh
