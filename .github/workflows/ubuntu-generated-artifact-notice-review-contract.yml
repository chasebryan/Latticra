name: Ubuntu Generated-Artifact Notice Review Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-generated-artifact-notice-review-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-generated-artifact-notice-review-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-generated-artifact-notice-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu generated-artifact notice review contract guard
        run: sh scripts/test-ubuntu-generated-artifact-notice-review-contract.sh
