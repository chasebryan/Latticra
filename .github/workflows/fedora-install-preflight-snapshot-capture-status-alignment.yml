name: Fedora Install Preflight Snapshot Capture Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-install-preflight-snapshot-capture-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora install preflight snapshot capture status alignment guard
        run: sh scripts/test-fedora-install-preflight-snapshot-capture-status-alignment.sh
