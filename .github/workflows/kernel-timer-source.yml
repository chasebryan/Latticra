name: Kernel timer source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-timer-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel timer source guard
        run: sh scripts/test-kernel-timer-source.sh

      - name: Run kernel timer source report runner
        run: sh scripts/test-kernel-timer-source-report-runner.sh
