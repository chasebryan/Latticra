name: Fedora Package Metadata Plan

on:
  pull_request:
    paths:
      - "scripts/test-fedora-package-metadata-plan.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-package-metadata-plan.sh"

permissions:
  contents: read

jobs:
  fedora-package-metadata-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora package metadata plan guard
        run: sh scripts/test-fedora-package-metadata-plan.sh
