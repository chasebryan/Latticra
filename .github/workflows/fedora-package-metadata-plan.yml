name: Fedora Package Metadata Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-package-metadata-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora package metadata plan guard
        run: sh scripts/test-fedora-package-metadata-plan.sh
