name: Latticra Identity-Replay Model-2 Prediction Failure Analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra identity-replay Model-2 prediction failure analysis guard
        run: sh scripts/test-latticra-identity-replay-model2-prediction-failure-analysis.sh
