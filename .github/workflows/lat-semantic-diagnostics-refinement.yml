name: Lat Semantic Diagnostics Refinement

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-semantic-diagnostics-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Lat semantic diagnostics refinement guard
        run: sh scripts/test-lat-semantic-diagnostics-refinement.sh
      - name: Run Lat semantic validation tests
        run: sh scripts/test-lat-semantic-validation.sh
