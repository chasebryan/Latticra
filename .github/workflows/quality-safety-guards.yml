name: Quality Safety Guards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-safety-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run quality safety guards
        run: make quality-safety-guards
