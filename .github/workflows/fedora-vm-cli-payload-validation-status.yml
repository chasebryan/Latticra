name: Fedora VM CLI Payload Validation Status

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-validation-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM CLI payload validation status guard
        run: sh scripts/test-fedora-vm-cli-payload-validation-status-alignment.sh
