name: Kernel Lifecycle Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-lifecycle-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run kernel lifecycle status alignment guard
        run: sh scripts/test-kernel-lifecycle-status-alignment.sh
