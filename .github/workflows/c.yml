name: C

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  state-lattice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run state lattice tests
        run: sh scripts/test-state-lattice.sh
      - name: Run tri-plane transition tests
        run: sh scripts/test-tri-plane-transition.sh
      - name: Run Nucleus preview tests
        run: sh scripts/test-nucleus-preview.sh
      - name: Run L-UI static report tests
        run: sh scripts/test-l-ui-static-report.sh
      - name: Run L-UI grammar fixture tests
        run: sh scripts/test-l-ui-grammar-fixtures.sh
      - name: Run L-UI parser design guard
        run: sh scripts/test-l-ui-parser-design.sh
      - name: Run L-UI parser implementation plan guard
        run: sh scripts/test-l-ui-parser-implementation-plan.sh
      - name: Run L-UI parser tests
        run: sh scripts/test-l-ui-parser.sh
      - name: Run L-UI parser fixture integration
        run: sh scripts/test-l-ui-parser-fixture-integration.sh
      - name: Run L-UI parser result report tests
        run: sh scripts/test-l-ui-parser-result-report.sh
      - name: Run L-UI parser diagnostics contract guard
        run: sh scripts/test-l-ui-parser-diagnostics-contract.sh
      - name: Run L-UI parser diagnostics implementation plan guard
        run: sh scripts/test-l-ui-parser-diagnostics-implementation-plan.sh
      - name: Run L-UI parser diagnostics tests
        run: sh scripts/test-l-ui-parser-diagnostics.sh
      - name: Run L-UI parser line-column precision plan guard
        run: sh scripts/test-l-ui-parser-line-column-precision-plan.sh
      - name: Run L-UI parser line-column implementation plan guard
        run: sh scripts/test-l-ui-parser-line-column-precision-implementation-plan.sh
      - name: Run L-UI parser location tests
        run: sh scripts/test-l-ui-parser-location.sh
      - name: Run L-UI parser source-span contract guard
        run: sh scripts/test-l-ui-parser-source-span-contract.sh
      - name: Run L-UI parser source-span implementation plan guard
        run: sh scripts/test-l-ui-parser-source-span-implementation-plan.sh
      - name: Run L-UI parser source-span tests
        run: sh scripts/test-l-ui-parser-source-span.sh
      - name: Run L-UI parser AST contract guard
        run: sh scripts/test-l-ui-parser-ast-contract.sh
      - name: Run L-UI parser AST implementation plan guard
        run: sh scripts/test-l-ui-parser-ast-implementation-plan.sh
      - name: Run L-UI parser AST tests
        run: sh scripts/test-l-ui-parser-ast.sh
      - name: Run L-UI AST detailed report contract guard
        run: sh scripts/test-l-ui-ast-detailed-report-contract.sh
      - name: Run L-UI AST detailed report implementation plan guard
        run: sh scripts/test-l-ui-ast-detailed-report-implementation-plan.sh
      - name: Run L-UI AST detailed report tests
        run: sh scripts/test-l-ui-ast-detailed-report.sh
      - name: Run L-UI AST escaped string report contract guard
        run: sh scripts/test-l-ui-ast-escaped-string-report-contract.sh
      - name: Run L-UI AST escaped string report implementation plan guard
        run: sh scripts/test-l-ui-ast-escaped-string-report-implementation-plan.sh
      - name: Run L-UI AST escaped string report tests
        run: sh scripts/test-l-ui-ast-escaped-string-report.sh
      - name: Run L-UI AST source-backed text contract guard
        run: sh scripts/test-l-ui-ast-source-backed-text-contract.sh
      - name: Run L-UI AST source-backed text implementation plan guard
        run: sh scripts/test-l-ui-ast-source-backed-text-implementation-plan.sh
      - name: Run L-UI AST source-backed text tests
        run: sh scripts/test-l-ui-ast-source-backed-text.sh
      - name: Run L-UI string-literal escape contract guard
        run: sh scripts/test-l-ui-string-literal-escape-contract.sh
      - name: Run L-UI string-literal escape implementation plan guard
        run: sh scripts/test-l-ui-string-literal-escape-implementation-plan.sh
