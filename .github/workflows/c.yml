name: C

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  state-lattice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run state lattice tests
        run: sh scripts/test-state-lattice.sh
      - name: Run tri-plane transition tests
        run: sh scripts/test-tri-plane-transition.sh
      - name: Run Nucleus preview tests
        run: sh scripts/test-nucleus-preview.sh
