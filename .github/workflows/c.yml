name: C

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  state-lattice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run state lattice tests
        run: sh scripts/test-state-lattice.sh
      - name: Run tri-plane transition tests
        run: sh scripts/test-tri-plane-transition.sh
      - name: Run Nucleus preview tests
        run: sh scripts/test-nucleus-preview.sh
      - name: Run L-UI static report tests
        run: sh scripts/test-l-ui-static-report.sh
      - name: Run L-UI grammar fixture tests
        run: sh scripts/test-l-ui-grammar-fixtures.sh
      - name: Run L-UI parser design guard
        run: sh scripts/test-l-ui-parser-design.sh
      - name: Run L-UI parser implementation plan guard
        run: sh scripts/test-l-ui-parser-implementation-plan.sh
      - name: Run L-UI parser tests
        run: sh scripts/test-l-ui-parser.sh
      - name: Run L-UI parser fixture integration
        run: sh scripts/test-l-ui-parser-fixture-integration.sh
      - name: Run L-UI parser result report tests
        run: sh scripts/test-l-ui-parser-result-report.sh
      - name: Run L-UI parser diagnostics contract guard
        run: sh scripts/test-l-ui-parser-diagnostics-contract.sh
      - name: Run L-UI parser diagnostics implementation plan guard
        run: sh scripts/test-l-ui-parser-diagnostics-implementation-plan.sh
      - name: Run L-UI parser diagnostics tests
        run: sh scripts/test-l-ui-parser-diagnostics.sh
