name: Fedora Install Preflight Snapshot Capture

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-install-preflight-snapshot-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora install preflight snapshot capture guard
        run: sh scripts/test-fedora-install-preflight-snapshot-capture.sh
      - name: Run Fedora install preflight snapshot capture docs guard
        run: sh scripts/test-fedora-install-preflight-snapshot-capture-docs.sh
