name: Local Installer Artifact Manifest Contract

on:
  pull_request:
    paths:
      - "scripts/test-local-installer-artifact-manifest-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-local-installer-artifact-manifest-contract.sh"

permissions:
  contents: read

jobs:
  local-installer-artifact-manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run local installer artifact manifest contract guard
        run: sh scripts/test-local-installer-artifact-manifest-contract.sh
