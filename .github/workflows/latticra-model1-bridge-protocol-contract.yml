name: Latticra Model-1 Bridge Protocol Contract

on:
  pull_request:
    paths:
      - "scripts/test-latticra-model1-bridge-protocol-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-model1-bridge-protocol-contract.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra Model-1 bridge protocol contract guard
        run: sh scripts/test-latticra-model1-bridge-protocol-contract.sh
