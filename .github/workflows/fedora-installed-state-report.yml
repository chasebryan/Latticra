name: Fedora Installed-State Report

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-installed-state-report:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Prepare checkout tools
        run: dnf -y install git tar gzip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Fedora installed-state report guard
        run: sh scripts/test-fedora-installed-state-report-lane.sh