name: Ubuntu Trademark Notice Boundary Contract

on:
  pull_request:
    paths:
      - "scripts/test-ubuntu-trademark-notice-boundary-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-ubuntu-trademark-notice-boundary-contract.sh"

permissions:
  contents: read

jobs:
  ubuntu-trademark-notice-boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Ubuntu trademark notice boundary contract guard
        run: sh scripts/test-ubuntu-trademark-notice-boundary-contract.sh
