name: Fedora RPM Artifact Naming Contract

on:
  push:
    paths:
      - 'docs/FEDORA_RPM_ARTIFACT_NAMING_CONTRACT.md'
      - 'docs/status/FEDORA_RPM_ARTIFACT_NAMING_CONTRACT_STATUS.md'
      - 'scripts/test-fedora-rpm-artifact-naming-contract.sh'
      - '.github/workflows/fedora-rpm-artifact-naming-contract.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fedora-rpm-artifact-naming-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM artifact naming contract guard
        run: sh scripts/test-fedora-rpm-artifact-naming-contract.sh
