name: LIR Report Refinement

on:
  pull_request:
    paths:
      - "scripts/test-lir-report-refinement.sh"
      - "scripts/test-lir-shape.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-lir-report-refinement.sh"
      - "scripts/test-lir-shape.sh"

permissions:
  contents: read

jobs:
  lir-report-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run LIR report refinement guard
        run: sh scripts/test-lir-report-refinement.sh
      - name: Run LIR shape tests
        run: sh scripts/test-lir-shape.sh
