name: Fedora Manual Host RC Decision Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-manual-host-rc-decision-status-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora manual host RC decision status alignment guard
        run: sh scripts/test-fedora-manual-host-rc-decision-status-alignment.sh
