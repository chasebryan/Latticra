name: macos-reset-uninstall-closeout-audit-review-disposition-closeout

on:
  pull_request:
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-acceptance-denial-disposition-closeout-audit-review-disposition-closeout-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-acceptance-denial-disposition-closeout-audit-review-disposition-closeout-contract.sh"

permissions:
  contents: read

jobs:
  closeout-audit-review-disposition-closeout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate macOS reset/uninstall live-runner acceptance-denial disposition closeout audit review disposition closeout contract
        run: sh scripts/test-macos-reset-uninstall-live-runner-acceptance-denial-disposition-closeout-audit-review-disposition-closeout-contract.sh
