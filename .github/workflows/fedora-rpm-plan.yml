name: Fedora RPM Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-rpm-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora RPM plan guard
        run: sh scripts/test-fedora-local-binary-rpm-build-plan.sh