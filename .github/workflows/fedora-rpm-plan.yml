name: Fedora RPM Plan

on:
  pull_request:
    paths:
      - "scripts/test-fedora-local-binary-rpm-build-plan.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-local-binary-rpm-build-plan.sh"

permissions:
  contents: read

jobs:
  fedora-rpm-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM plan guard
        run: sh scripts/test-fedora-local-binary-rpm-build-plan.sh