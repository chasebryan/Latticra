name: Fedora RPM Gate Status Alignment

on:
  pull_request:
    paths:
      - "scripts/test-fedora-rpm-gate-classifier-status-alignment.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-rpm-gate-classifier-status-alignment.sh"

permissions:
  contents: read

jobs:
  fedora-rpm-gate-status-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM gate status alignment guard
        run: sh scripts/test-fedora-rpm-gate-classifier-status-alignment.sh
