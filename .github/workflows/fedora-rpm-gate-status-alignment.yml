name: Fedora RPM Gate Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-rpm-gate-status-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora RPM gate status alignment guard
        run: sh scripts/test-fedora-rpm-gate-classifier-status-alignment.sh
