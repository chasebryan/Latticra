name: Latticra Higgs Chain Verifier

on:
  pull_request:
    paths:
      - "scripts/test-latticra-higgs-chain-verifier.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-higgs-chain-verifier.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra Higgs chain verifier guard
        run: sh scripts/test-latticra-higgs-chain-verifier.sh
