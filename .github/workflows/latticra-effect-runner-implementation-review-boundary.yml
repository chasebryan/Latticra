name: Latticra Effect Runner Implementation Review Boundary

on:
  pull_request:
    paths:
      - "scripts/test-latticra-effect-runner-implementation-review-boundary.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-effect-runner-implementation-review-boundary.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra effect runner implementation review boundary guard
        run: sh scripts/test-latticra-effect-runner-implementation-review-boundary.sh
