name: openSUSE Local RPM Static Validation

on:
  pull_request:
    paths:
      - "scripts/test-opensuse-local-rpm-static-validation.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-opensuse-local-rpm-static-validation.sh"

permissions:
  contents: read

jobs:
  opensuse-local-rpm-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run openSUSE local RPM static validation guard
        run: sh scripts/test-opensuse-local-rpm-static-validation.sh
