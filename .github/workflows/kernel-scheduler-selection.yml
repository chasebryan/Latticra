name: Kernel scheduler selection

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-scheduler-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel scheduler selection guard
        run: sh scripts/test-kernel-scheduler-selection.sh

      - name: Run kernel scheduler selection report runner
        run: sh scripts/test-kernel-scheduler-selection-report-runner.sh
