name: Fedora RPM Build Evidence Intake Denial Disposition Contract

on:
  pull_request:
    paths:
      - "scripts/test-fedora-rpm-build-evidence-intake-denial-disposition-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-rpm-build-evidence-intake-denial-disposition-contract.sh"

permissions:
  contents: read

jobs:
  fedora-rpm-build-evidence-intake-denial-disposition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora RPM build evidence intake denial disposition contract guard
        run: sh scripts/test-fedora-rpm-build-evidence-intake-denial-disposition-contract.sh
