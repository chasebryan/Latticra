name: Latticra No-Effect CLI Status Surface

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  latticra-no-effect-cli-status-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Latticra no-effect CLI status surface guard
        run: sh scripts/test-latticra-no-effect-cli-status-surface.sh
