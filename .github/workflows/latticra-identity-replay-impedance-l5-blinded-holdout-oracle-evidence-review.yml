name: Latticra Identity-Replay Impedance L5 Evidence Review

on:
  pull_request:
    paths:
      - "scripts/test-latticra-identity-replay-impedance-l5-blinded-holdout-oracle-evidence-review.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-identity-replay-impedance-l5-blinded-holdout-oracle-evidence-review.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra identity-replay impedance L5 blinded-holdout oracle evidence review guard
        run: sh scripts/test-latticra-identity-replay-impedance-l5-blinded-holdout-oracle-evidence-review.sh
