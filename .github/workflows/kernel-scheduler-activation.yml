name: Kernel scheduler activation

on:
  pull_request:
    paths:
      - "scripts/test-kernel-scheduler-activation-report-runner.sh"
      - "scripts/test-kernel-scheduler-activation.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-scheduler-activation-report-runner.sh"
      - "scripts/test-kernel-scheduler-activation.sh"

permissions:
  contents: read

jobs:
  kernel-scheduler-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel scheduler activation guard
        run: sh scripts/test-kernel-scheduler-activation.sh

      - name: Run kernel scheduler activation report runner
        run: sh scripts/test-kernel-scheduler-activation-report-runner.sh
