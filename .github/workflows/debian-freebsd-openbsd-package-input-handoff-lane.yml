name: Debian FreeBSD OpenBSD Package Input Handoff Lane

on:
  pull_request:
    paths:
      - "scripts/test-debian-freebsd-openbsd-package-input-handoff-lane.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-debian-freebsd-openbsd-package-input-handoff-lane.sh"

permissions:
  contents: read

jobs:
  debian-freebsd-openbsd-package-input-handoff-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Debian FreeBSD OpenBSD package input handoff lane
        run: sh scripts/test-debian-freebsd-openbsd-package-input-handoff-lane.sh
