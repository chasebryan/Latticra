name: Latticra Seal Signer Invocation Status

on:
  pull_request:
    paths:
      - "scripts/test-latticra-seal-signer-invocation-status.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-seal-signer-invocation-status.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: sh scripts/test-latticra-seal-signer-invocation-status.sh
