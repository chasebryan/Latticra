name: Fedora Manual Host Dry-Run Transcript Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-manual-host-dry-run-transcript-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora manual host dry-run transcript contract guard
        run: sh scripts/test-fedora-manual-host-dry-run-transcript-contract.sh
