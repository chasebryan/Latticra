name: Fedora VM CLI Payload README Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-readme-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM CLI payload README alignment guard
        run: sh scripts/test-fedora-vm-cli-payload-readme-alignment.sh
