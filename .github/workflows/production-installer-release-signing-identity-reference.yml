name: Production Installer Release Signing Identity Reference

on:
  push:
    paths:
      - 'docs/PRODUCTION_INSTALLER_RELEASE_SIGNING_IDENTITY_REFERENCE_CONTRACT.md'
      - 'docs/status/PRODUCTION_INSTALLER_RELEASE_SIGNING_IDENTITY_REFERENCE_STATUS.md'
      - 'scripts/production-installer-release-signing-identity-reference.sh'
      - 'scripts/test-production-installer-release-signing-identity-reference-contract.sh'
      - '.github/workflows/production-installer-release-signing-identity-reference.yml'
  pull_request:

permissions:
  contents: read

jobs:
  production-installer-release-signing-identity-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer release signing identity reference guard
        run: sh scripts/test-production-installer-release-signing-identity-reference-contract.sh
