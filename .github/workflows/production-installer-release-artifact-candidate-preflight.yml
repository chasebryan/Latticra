name: Production Installer Release Artifact Candidate Preflight

on:
  push:
    paths:
      - 'docs/PRODUCTION_INSTALLER_RELEASE_ARTIFACT_CANDIDATE_PREFLIGHT_CONTRACT.md'
      - 'docs/status/PRODUCTION_INSTALLER_RELEASE_ARTIFACT_CANDIDATE_PREFLIGHT_STATUS.md'
      - 'scripts/production-installer-release-artifact-candidate-preflight.sh'
      - 'scripts/test-production-installer-release-artifact-candidate-preflight-contract.sh'
      - '.github/workflows/production-installer-release-artifact-candidate-preflight.yml'
  pull_request:

permissions:
  contents: read

jobs:
  production-installer-release-artifact-candidate-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run production installer release artifact candidate preflight guard
        run: sh scripts/test-production-installer-release-artifact-candidate-preflight-contract.sh
