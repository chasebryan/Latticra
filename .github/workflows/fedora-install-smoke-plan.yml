name: Fedora Install Smoke Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-install-smoke-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora install smoke plan guard
        run: sh scripts/test-fedora-local-install-smoke-plan.sh