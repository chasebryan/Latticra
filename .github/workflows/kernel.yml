name: Kernel

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run kernel guard
        run: sh scripts/test-kernel.sh
      - name: Run kernel report runner guard
        run: sh scripts/test-kernel-report-runner.sh
