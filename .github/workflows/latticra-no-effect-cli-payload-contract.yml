name: Latticra No-Effect CLI Payload Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  latticra-no-effect-cli-payload-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Latticra no-effect CLI payload contract guard
        run: sh scripts/test-latticra-no-effect-cli-payload-contract.sh
