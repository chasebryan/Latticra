name: macos-reset-uninstall-closeout-audit-review-disposition-disposition

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  review-disposition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate no-effect disposition contract
        run: |
          script='scripts/test-macos-reset-uninstall-live-runner-acceptance-denial'
          script="${script}-disposition-closeout-audit-review-disposition"
          script="${script}-closeout-audit-review-disposition-closeout-audit-review"
          script="${script}-disposition-closeout-audit-review-disposition-contract.sh"
          sh "$script"
