name: Fedora VM CLI Payload Validation Evidence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-cli-payload-validation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM CLI payload validation evidence guard
        run: sh scripts/test-fedora-vm-cli-payload-validation-evidence-status.sh
