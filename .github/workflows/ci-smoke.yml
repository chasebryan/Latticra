name: CI Smoke

on:
  push: {}
  pull_request: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev ca-certificates clang-format

      - name: Build
        run: make -j$(nproc) seal-cli

      - name: Run seal check
        run: ./build/latticra-seal check

      - name: Run hybrid-provider self-test
        run: ./build/latticra-seal hybrid-provider-self-test

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C formatting
        run: |
          # Apply clang-format in-place using style file if present; fail if any diffs remain
          git ls-files "*.c" "*.h" | xargs -r clang-format -style=file -fallback-style=none -i || true
          git diff --exit-code || (echo 'Formatting issues detected. Run clang-format.' && exit 1)
