name: openSUSE RPM Validation Promotion Blocker Matrix Contract

on:
  push:
    paths:
      - 'docs/OPENSUSE_RPM_VALIDATION_PROMOTION_BLOCKER_MATRIX_CONTRACT.md'
      - 'scripts/test-opensuse-rpm-validation-promotion-blocker-matrix-contract.sh'
      - '.github/workflows/opensuse-rpm-validation-promotion-blocker-matrix-contract.yml'
  pull_request:
    paths:
      - 'docs/OPENSUSE_RPM_VALIDATION_PROMOTION_BLOCKER_MATRIX_CONTRACT.md'
      - 'scripts/test-opensuse-rpm-validation-promotion-blocker-matrix-contract.sh'
      - '.github/workflows/opensuse-rpm-validation-promotion-blocker-matrix-contract.yml'

permissions:
  contents: read

jobs:
  opensuse-rpm-validation-promotion-blocker-matrix-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run openSUSE RPM validation promotion blocker matrix contract guard
        run: sh scripts/test-opensuse-rpm-validation-promotion-blocker-matrix-contract.sh
