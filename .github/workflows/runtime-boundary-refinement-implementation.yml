name: Runtime Boundary Refinement Implementation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-boundary-refinement-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run runtime boundary refinement implementation guard
        run: sh scripts/test-runtime-boundary-refinement-implementation.sh
      - name: Run runtime boundary tests
        run: sh scripts/test-runtime-boundary.sh
