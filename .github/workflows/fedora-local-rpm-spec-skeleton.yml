name: Fedora Local RPM Spec Skeleton

on:
  pull_request:
    paths:
      - "scripts/test-fedora-local-rpm-spec-skeleton.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-fedora-local-rpm-spec-skeleton.sh"

permissions:
  contents: read

jobs:
  fedora-local-rpm-spec-skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Fedora local RPM spec skeleton guard
        run: sh scripts/test-fedora-local-rpm-spec-skeleton.sh
