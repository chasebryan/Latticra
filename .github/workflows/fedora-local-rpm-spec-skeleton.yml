name: Fedora Local RPM Spec Skeleton

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-local-rpm-spec-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Fedora local RPM spec skeleton guard
        run: sh scripts/test-fedora-local-rpm-spec-skeleton.sh
