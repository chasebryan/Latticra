name: Fedora VM Gate Classifier Status Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-gate-classifier-status-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM gate classifier status alignment guard
        run: sh scripts/test-fedora-vm-gate-classifier-status-alignment.sh
