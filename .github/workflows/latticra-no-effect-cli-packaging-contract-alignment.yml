name: Latticra No-Effect CLI Packaging Contract Alignment

on:
  pull_request:
    paths:
      - "scripts/test-latticra-no-effect-cli-packaging-contract-alignment.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-latticra-no-effect-cli-packaging-contract-alignment.sh"

permissions:
  contents: read

jobs:
  latticra-no-effect-cli-packaging-contract-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Latticra no-effect CLI packaging contract alignment guard
        run: sh scripts/test-latticra-no-effect-cli-packaging-contract-alignment.sh
