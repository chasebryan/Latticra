name: macOS Reset Uninstall Live Target Classifier

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run macOS reset uninstall live-target classifier guard
        run: sh scripts/test-macos-reset-uninstall-live-target-classifier.sh
