name: macOS Reset Uninstall Live Runner Denied Dispatch Review Contract

on:
  pull_request:
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-denied-dispatch-review-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-macos-reset-uninstall-live-runner-denied-dispatch-review-contract.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run macOS reset uninstall live-runner denied-dispatch review contract guard
        run: sh scripts/test-macos-reset-uninstall-live-runner-denied-dispatch-review-contract.sh
