name: Hybrid License Posture

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hybrid-license-posture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run hybrid license posture guard
        run: sh scripts/test-hybrid-license-posture.sh
