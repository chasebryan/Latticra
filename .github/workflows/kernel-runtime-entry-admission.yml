name: Kernel runtime entry admission

on:
  pull_request:
    paths:
      - "scripts/test-kernel-runtime-entry-admission-report-runner.sh"
      - "scripts/test-kernel-runtime-entry-admission.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-kernel-runtime-entry-admission-report-runner.sh"
      - "scripts/test-kernel-runtime-entry-admission.sh"

permissions:
  contents: read

jobs:
  kernel-runtime-entry-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel runtime-entry admission guard
        run: sh scripts/test-kernel-runtime-entry-admission.sh

      - name: Run kernel runtime-entry admission report runner
        run: sh scripts/test-kernel-runtime-entry-admission-report-runner.sh
