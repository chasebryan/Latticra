name: Fedora VM CLI Transcript Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fedora-vm-cli-transcript-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fedora VM CLI transcript contract guard
        run: sh scripts/test-fedora-vm-cli-transcript-contract.sh
