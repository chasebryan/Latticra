name: System Bootstrap

on:
  pull_request:
    paths:
      - "scripts/test-system-bootstrap.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-system-bootstrap.sh"

permissions:
  contents: read

jobs:
  system-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run system bootstrap guard
        run: sh scripts/test-system-bootstrap.sh
