name: Latticra Seal Panel Dashboard View Model Implementation Plan Status

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: sh scripts/test-latticra-seal-panel-dashboard-view-model-implementation-plan-status.sh
