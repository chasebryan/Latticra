name: Latticra Panel Installer CI

on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/latticra-panel-installer.yml"
      - "README.md"
      - "docs/status/LATTICRA_PANEL_LOCAL_INSTALL_EVIDENCE_STATUS.md"
      - "docs/status/LATTICRA_PANEL_LOCAL_INSTALL_PUBLIC_ENTRYPOINT_ALIGNMENT.md"
      - "scripts/test-latticra-panel-local-install-*.sh"
      - "scripts/check_latticra_panel_ui_design.py"
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - ".github/workflows/latticra-panel-installer.yml"
      - "README.md"
      - "docs/status/LATTICRA_PANEL_LOCAL_INSTALL_EVIDENCE_STATUS.md"
      - "docs/status/LATTICRA_PANEL_LOCAL_INSTALL_PUBLIC_ENTRYPOINT_ALIGNMENT.md"
      - "scripts/test-latticra-panel-local-install-*.sh"
      - "scripts/check_latticra_panel_ui_design.py"

permissions:
  contents: read

jobs:
  installer:
    name: Installer dry-run and Rust check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            pkg-config \
            desktop-file-utils \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Check Rust formatting
        run: cargo fmt --manifest-path installer/latticra-installer/Cargo.toml -- --check

      - name: Check Rust installer crate
        run: cargo check --locked --manifest-path installer/latticra-installer/Cargo.toml

      - name: Validate Panel UI design checkpoint
        run: python3 scripts/check_latticra_panel_ui_design.py

      - name: Validate installer shell scripts
        run: |
          for script in installer/scripts/*.sh; do
            sh -n "$script"
          done

      - name: Validate Latticra Panel local install evidence status
        run: sh scripts/test-latticra-panel-local-install-evidence-status.sh

      - name: Validate Latticra Panel public entrypoint alignment
        run: sh scripts/test-latticra-panel-local-install-public-entrypoint-alignment.sh

      - name: Run installer dry-run
        run: make -C installer dry-run

      - name: Run guarded local-prefix install
        run: make -C installer local-example

      - name: Verify guarded local-prefix install
        run: make -C installer verify-local

      - name: Uninstall guarded local-prefix install
        run: make -C installer uninstall-local
