permissions:
  contents: read

jobs:
  installer:
    name: Installer dry-run and Rust check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            pkg-config \
            desktop-file-utils \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Check Rust formatting
        run: cargo fmt --manifest-path installer/latticra-installer/Cargo.toml -- --check

      - name: Check Rust installer crate
        run: cargo check --locked --manifest-path installer/latticra-installer/Cargo.toml

      - name: Validate Panel UI design checkpoint
        run: python3 scripts/check_latticra_panel_ui_design.py

      - name: Validate Latticra Panel LC install configuration
        run: sh scripts/test-latticra-panel-lc-install-config.sh

      - name: Validate standalone LC local install verifier
        run: sh scripts/test-latticra-panel-local-install-lc-install-config.sh

      - name: Validate Latticra Panel updater surface
        run: sh scripts/test-latticra-panel-updater.sh

      - name: Validate Latticra Panel signed updater delivery gate
        run: sh scripts/test-latticra-panel-signed-updater-delivery-gate.sh

      - name: Validate Latticra Panel signed updater denial transcript
        run: sh scripts/test-latticra-panel-signed-updater-denial-transcript.sh

      - name: Validate Latticra Panel signed updater manifest fixture contract
        run: sh scripts/test-latticra-panel-signed-updater-manifest-fixture-contract.sh

      - name: Validate Latticra Panel signed updater manifest fixture validation
        run: sh scripts/test-latticra-panel-signed-updater-manifest-fixture-validation.sh

      - name: Validate Latticra Panel signed updater state fixture contract
        run: sh scripts/test-latticra-panel-signed-updater-state-fixture-contract.sh

      - name: Validate Latticra Panel signed updater state fixture validation
        run: sh scripts/test-latticra-panel-signed-updater-state-fixture-validation.sh

      - name: Validate Latticra Panel signed updater state transition denial transcript
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-transcript.sh

      - name: Validate Latticra Panel signed updater state transition denial review
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-review.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition review
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-review.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition closeout
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-closeout.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition closeout audit
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-closeout-audit.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition closeout audit review
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-closeout-audit-review.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition closeout audit review disposition
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-closeout-audit-review-disposition.sh

      - name: Validate Latticra Panel signed updater state transition denial disposition closeout audit review disposition review
        run: sh scripts/test-latticra-panel-signed-updater-state-transition-denial-disposition-closeout-audit-review-disposition-review.sh

      - name: Validate installer shell scripts
        run: |
          for script in installer/scripts/*.sh; do
            sh -n "$script"
          done

      - name: Validate Latticra Panel local install evidence status
        run: sh scripts/test-latticra-panel-local-install-evidence-status.sh

      - name: Validate Latticra Panel public entrypoint alignment
        run: sh scripts/test-latticra-panel-local-install-public-entrypoint-alignment.sh

      - name: Run installer dry-run
        run: make -C installer dry-run

      - name: Run guarded local-prefix install
        run: make -C installer local-example

      - name: Verify guarded local-prefix install
        run: make -C installer verify-local

      - name: Uninstall guarded local-prefix install
        run: make -C installer uninstall-local
