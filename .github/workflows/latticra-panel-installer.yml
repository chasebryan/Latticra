name: Latticra Panel Installer CI

on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/latticra-panel-installer.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - ".github/workflows/latticra-panel-installer.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  installer:
    name: Installer dry-run and Rust check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            pkg-config \
            desktop-file-utils \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path installer/latticra-installer/Cargo.toml -- --check

      - name: Check Rust installer crate
        run: cargo check --manifest-path installer/latticra-installer/Cargo.toml

      - name: Validate installer shell scripts
        run: |
          for script in installer/scripts/*.sh; do
            sh -n "$script"
          done

      - name: Run installer dry-run
        run: make -C installer dry-run

      - name: Run guarded local-prefix install
        run: make -C installer local-example

      - name: Verify guarded local-prefix install
        run: make -C installer verify-local

      - name: Uninstall guarded local-prefix install
        run: make -C installer uninstall-local
