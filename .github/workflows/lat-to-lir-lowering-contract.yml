name: Lat-to-LIR Lowering Contract

on:
  pull_request:
    paths:
      - "scripts/test-lat-to-lir-lowering-contract.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-lat-to-lir-lowering-contract.sh"

permissions:
  contents: read

jobs:
  lat-to-lir-lowering-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Lat-to-LIR lowering contract guard
        run: sh scripts/test-lat-to-lir-lowering-contract.sh
