name: Lat-to-LIR Lowering Implementation Plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lat-to-lir-lowering-implementation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run Lat-to-LIR lowering implementation plan guard
        run: sh scripts/test-lat-to-lir-lowering-implementation-plan.sh
