name: Kernel VFS namespace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kernel-vfs-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run kernel VFS namespace guard
        run: sh scripts/test-kernel-vfs-namespace.sh

      - name: Run kernel VFS namespace report runner
        run: sh scripts/test-kernel-vfs-namespace-report-runner.sh
