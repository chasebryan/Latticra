name: System Bootstrap Main C Integration

on:
  pull_request:
    paths:
      - "scripts/test-system-bootstrap-main-c-integration.sh"
  push:
    branches:
      - main
    paths:
      - "scripts/test-system-bootstrap-main-c-integration.sh"

permissions:
  contents: read

jobs:
  system-bootstrap-main-c-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Run system bootstrap main C integration guard
        run: sh scripts/test-system-bootstrap-main-c-integration.sh
