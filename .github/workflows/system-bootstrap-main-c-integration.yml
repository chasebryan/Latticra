name: System Bootstrap Main C Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  system-bootstrap-main-c-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run system bootstrap main C integration guard
        run: sh scripts/test-system-bootstrap-main-c-integration.sh
