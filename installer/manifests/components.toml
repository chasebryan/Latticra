[manifest]
name = "latticra-installer-components"
version = "0.2.0"
production_installer_ready = false
network_authority = false
root_authority = false

[components.lat_tooling]
label = "Lat language tooling"
default_enabled = true
authority = "local-prefix"
generated_paths = ["bin/lat", "components/lat-tooling.installed"]
notes = "Early scaffold creates a shim until real Lat artifacts are wired in."

[components.lir_contracts]
label = "LIR contracts"
default_enabled = true
authority = "local-prefix"
generated_paths = ["share/latticra/lir-contracts/README.md", "components/lir-contracts.installed"]
notes = "Defines space for LIR contract documents and later compiled contract artifacts."

[components.seal_report_only]
label = "Latticra Seal report-only subsystem"
default_enabled = true
authority = "local-prefix"
generated_paths = ["bin/latticra-seal", "etc/latticra/seal.toml", "components/latticra-seal.installed"]
notes = "Report-only subsystem. No enforcement authority in this early installer."

[components.nadia_offline_ai]
label = "Nadia offline AI foundation"
default_enabled = false
authority = "local-prefix"
generated_paths = ["bin/latticra-nadia", "etc/latticra/nadia.toml", "share/latticra/nadia/README.md", "share/latticra/nadia/context-packs", "share/latticra/nadia/runtime-profiles", "share/latticra/nadia/prompt-plans", "share/latticra/nadia/mode-validations", "share/latticra/nadia/productivity-ledger", "share/latticra/nadia/protective-safety", "share/latticra/nadia/tool-preflights", "share/latticra/nadia/prompt-contracts", "share/latticra/nadia/model-registry", "share/latticra/nadia/inference-readiness", "share/latticra/nadia/runtime-invocation", "share/latticra/nadia/model-load", "share/latticra/nadia/prompt-receipt", "share/latticra/nadia/prompt-materialization", "components/nadia-offline-ai.installed"]
notes = "Stage-14 prompt-materialization contract, Stage-13 prompt-receipt contract, Stage-12 model-load contract, Stage-11 runtime-invocation contract, Stage-10 inference-readiness contract, Stage-9 local model-registry contract, Stage-8 prompt-evaluation contract, Stage-7 report-only tool preflight, Stage-6 protective safety boundary, Stage-5 productivity ledger, Stage-4 systems-engineering mode validation, Stage-3 prompt-plan workbench, Stage-2 runtime-profile, and Stage-1 local context-pack foundation with awareness principles. No sexual user functionality, prompt text receipt, prompt source reading, prompt buffer allocation, prompt tokenization, prompt materialization, prompt evaluation, inference, tool execution, model installation, training, distillation, source mutation, or network authority. Prompt-materialization metadata grants no prompt buffer allocation, prompt buffer writes, prompt tokenization, token generation, or inference authority."

[components.fedora_validation]
label = "Fedora validation files"
default_enabled = false
authority = "local-prefix"
generated_paths = ["share/latticra/fedora-validation/README.md", "components/fedora-validation.installed"]
notes = "Fedora validation workspace. Does not change the host OS."

[components.docs_and_examples]
label = "Documentation and examples"
default_enabled = true
authority = "local-prefix"
generated_paths = ["share/latticra/docs/README.md", "components/docs-and-examples.installed"]
notes = "Documentation landing space."

[components.developer_cli_helpers]
label = "Developer CLI helpers"
default_enabled = true
authority = "local-prefix"
generated_paths = ["bin/latticra-doctor", "components/developer-cli-helpers.installed"]
notes = "Small helpers for validating the local prefix install."
