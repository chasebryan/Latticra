[package]
name = "latticra-panel"
version = "0.2.0"
edition = "2021"
description = "Latticra Panel graphical first-run control workbench"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
